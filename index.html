
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Toqa's Cookie Clicker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Toqa's Cookie Clicker</h1>

        <p>Click the cookie and earn points!</p>

    </header>

    <main>

        <section class="game">

            <h2>My Cookies</h2>

            <h1 id="cookie-count">0</h1>

            <button id="cookie-button">
                Click me &#127850;
            </button>

            <p>Click the cookie to earn points!</p>

        </section>


        <section class="shop">

            <h2>Shop</h2>

            <h3>Cursor</h3>

            <p>
                Price: <span id="price">10</span>
            </p>

            <p>
                Owned: <span id="owned">0</span>
            </p>

            <button id="buy">
                Buy Cursor
            </button>


            <h3>Grandma</h3>

            <p>
                Price: <span id="grandma-price">50</span>
            </p>

            <p>
                Owned: <span id="grandma-owned">0</span>
            </p>

            <button id="buy-grandma">
                Buy Grandma
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
